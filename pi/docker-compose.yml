services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host          # accesible en http://10.42.0.1:8123
    volumes:
      - ./ha:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ./ollama-data:/root/.ollama
      - ./ollama/Modelfile:/Modelfile:ro
    restart: unless-stopped

  cerebro:
    build: ./cerebro
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      OLLAMA_URL: "http://ollama:11434"
      MODEL: asistente
      DB_PATH: /data/historial.db
      VENTANA_MEDIANA: ${VENTANA_MEDIANA:-5}
    volumes:
      - ./data:/data
    depends_on: [mosquitto, ollama]
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    ports: ["1984:1984"]          # panel y API: http://IP-DE-LA-PI:1984
    environment:
      IPHONE_URL: ${IPHONE_URL:-}
      ESP32_URL: ${ESP32_URL:-}
    volumes:
      - ./go2rtc:/config
    restart: unless-stopped

  vision:
    build: ./vision
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      CAMARAS: ${CAMARAS:-}
      SOLO_PRESENCIA: ${SOLO_PRESENCIA:-}
      INTERVALO: ${VISION_INTERVALO:-5}
      HILOS: ${VISION_HILOS:-2}
    depends_on: [mosquitto, go2rtc]
    cpus: ${VISION_CPUS:-1}
    mem_limit: 512m
    restart: unless-stopped

volumes:
  mosquitto_data:
