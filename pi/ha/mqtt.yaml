# Entidades MQTT (el broker se añade desde Ajustes > Dispositivos > MQTT, ver README)
sensor:
  - name: "Inventario manzana"
    unique_id: inventario_manzana
    state_topic: "casa/inventario"
    value_template: "{{ value_json.manzana | default(0) }}"
    state_class: measurement
    icon: mdi:counter
