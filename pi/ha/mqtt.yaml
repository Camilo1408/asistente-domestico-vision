  - name: "Personas camara1"
    unique_id: personas_camara1
    state_topic: "casa/camara1/presencia"
    value_template: "{{ value_json.personas }}"
    state_class: measurement
    icon: mdi:account-multiple
  - name: "Brillo camara1"
    unique_id: brillo_camara1
    state_topic: "casa/camara1/presencia"
    value_template: "{{ value_json.brillo }}"
    state_class: measurement
    icon: mdi:brightness-6
  - name: "Estado camara1"
    unique_id: estado_camara1
    state_topic: "casa/camara1/estado"
    icon: mdi:cctv
  - name: "Personas iphone"
    unique_id: personas_iphone
    state_topic: "casa/iphone/presencia"
    value_template: "{{ value_json.personas }}"
    state_class: measurement
    icon: mdi:account-multiple
  - name: "Brillo iphone"
    unique_id: brillo_iphone
    state_topic: "casa/iphone/presencia"
    value_template: "{{ value_json.brillo }}"
    state_class: measurement
    icon: mdi:brightness-6
  - name: "Estado iphone"
    unique_id: estado_iphone
    state_topic: "casa/iphone/estado"
    icon: mdi:cctv
  - name: "Asistente respuesta"
    unique_id: asistente_respuesta
    state_topic: "casa/asistente/respuesta"
    # El estado admite máx. 255 caracteres: el texto completo va como atributo
    value_template: "{{ value_json.ts | int | timestamp_custom('%H:%M:%S') }}"
    json_attributes_topic: "casa/asistente/respuesta"
    json_attributes_template: "{{ {'texto': value_json.texto, 'modo': value_json.modo, 'origen': value_json.origen} | tojson }}"
    icon: mdi:chat-processing
  - name: "Asistente historial"
    unique_id: asistente_historial
    state_topic: "casa/asistente/historial"
    value_template: "{{ value_json.n }}"
    json_attributes_topic: "casa/asistente/historial"
    json_attributes_template: "{{ {'items': value_json['items']} | tojson }}"
    icon: mdi:history
  - name: "Asistente proxima sugerencia"
    unique_id: asistente_proxima_sugerencia
    state_topic: "casa/asistente/auto/estado"
    value_template: >-
      {% set s = value_json.segundos_para_proxima %}
      {{ ((s.cuarto if s.cuarto < s.cocina else s.cocina) / 60) | round(0) | int }}
    unit_of_measurement: "min"
    json_attributes_topic: "casa/asistente/auto/estado"
    icon: mdi:timer-sand
  - name: "Asistente estado"
    unique_id: asistente_estado
    state_topic: "casa/asistente/estado"
    icon: mdi:brain

button:
  - name: "Pedir sugerencia"
    unique_id: asistente_pedir
    command_topic: "casa/asistente/pedir"
    payload_press: "boton"

# Imagen con las detecciones dibujadas (servicio vision)
camera:
  - name: "Deteccion camara1"
    unique_id: deteccion_camara1
    topic: "casa/camara1/imagen"
  - name: "Deteccion iphone"
    unique_id: deteccion_iphone
    topic: "casa/iphone/imagen"
